<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>JobPilot · Tara Banerjee</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />
<style>
  :root{
    --bg:#EEECE4; --card:#FBFAF5; --ink:#3B3E38; --sub:#86887E; --line:#E3E0D6;
    --sage:#6F9C86; --sage-deep:#557C68; --sage-soft:#E7EEEA;
    --clay:#A9805F; --clay-soft:#F1E9E0;
    --blue:#7C9BB3; --blue-soft:#E8EEF2;
    --gold:#BF9F5A; --gold-soft:#F3ECDB;
    --rose:#AE8C8C; --rose-soft:#EFE6E6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  .display{font-family:'Fraunces',Georgia,serif;}
  .app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{background:linear-gradient(135deg,var(--sage),var(--sage-deep));color:#fff;padding:26px 20px 20px;position:sticky;top:0;z-index:10;}
  .h-row{display:flex;justify-content:space-between;align-items:flex-end;}
  .h-title{font-size:26px;line-height:1;}
  .h-sub{font-size:12px;opacity:.85;margin-top:5px;}
  .h-stat{font-size:24px;line-height:1;text-align:right;}
  .h-stat small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-top:3px;}
  main{flex:1;overflow-y:auto;padding:16px 14px 110px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;}
  .pad{padding:16px;}
  .row{display:flex;gap:12px;align-items:flex-start;}
  .icon-badge{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--sage-soft);color:var(--sage-deep);}
  .muted{color:var(--sub);} .small{font-size:13px;} .xs{font-size:11px;}
  .title{font-weight:600;line-height:1.3;}
  .pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;}
  .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;border-radius:13px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);}
  .btn.fill{background:var(--sage);color:#fff;border-color:var(--sage);}
  .btn.soft{background:var(--sage-soft);color:var(--sage-deep);border-color:transparent;}
  .btn:disabled{opacity:.65;}
  .btn.sm{padding:9px 12px;font-size:12.5px;border-radius:11px;}
  a.btn{text-decoration:none;}
  input,textarea,select{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;outline:none;}
  textarea{resize:none;line-height:1.5;}
  label.fld{font-size:12px;font-weight:600;color:var(--sub);display:block;margin:14px 0 5px;}
  .out{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:10px;}
  .out pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.55;margin:0;color:var(--ink);}
  .out-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .label-cap{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);}
  nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 0 14px;z-index:20;}
  nav button{background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub);padding:2px 28px;}
  nav button.active{color:var(--sage-deep);}
  nav .lbl{font-size:11px;font-weight:600;}
  .ic{display:inline-flex;}
  .ic[data-sz="18"] svg{width:18px;height:18px;} .ic[data-sz="16"] svg{width:16px;height:16px;}
  .ic[data-sz="14"] svg{width:14px;height:14px;} .ic[data-sz="13"] svg{width:13px;height:13px;}
  .ic[data-sz="22"] svg{width:22px;height:22px;} .ic[data-sz="12"] svg{width:12px;height:12px;}
  .ic[data-sz="28"] svg{width:28px;height:28px;}
  svg.lucide{stroke-width:1.9;}
  .spin{animation:sp 1s linear infinite;} @keyframes sp{to{transform:rotate(360deg);}}
  .divider{border-top:1px solid var(--line);}
  .stat-card{border-radius:16px;border:1px solid var(--line);padding:14px;text-align:center;}
  .stat-n{font-size:22px;line-height:1;} .bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;}
  .empty{text-align:center;margin-top:64px;padding:0 22px;}
  .syncbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--sage-deep);background:var(--sage-soft);padding:8px 12px;border-radius:999px;}
</style>
