<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JobPilot">
<meta name="theme-color" content="#faf6ee">
<title>JobPilot HR</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:#faf6ee; min-height:100%;
    font-family:Georgia,serif; color:#222;}
  #wrap{max-width:560px; margin:0 auto; padding:24px 20px calc(100px + env(safe-area-inset-bottom,0px));
    padding-top:calc(env(safe-area-inset-top,0px) + 24px);}
  h2{color:#1F8A4C; margin:0 0 4px; font-size:24px;}
  .meta-line{color:#777; margin:0 0 18px; font-size:13px; font-family:-apple-system,sans-serif;}

  .card{border:1px solid #e8e2d6; border-radius:12px; padding:16px; margin:0 0 12px; background:#fffdf8;}
  .card .title{font-size:16px; font-weight:700; color:#222; line-height:1.35;}
  .card .company{color:#555; margin:4px 0; font-size:14px;}
  .card .src{font-size:13px; color:#777; margin:2px 0; font-family:-apple-system,sans-serif;}
  .card .postdate{font-size:12px; color:#999; margin:2px 0; font-family:-apple-system,sans-serif;}
  .card .actions{margin-top:8px; display:flex; align-items:center; gap:10px;}
  .score{background:#888; color:#fff; border-radius:20px; padding:3px 12px; font-size:13px; font-weight:700; font-family:-apple-system,sans-serif;}
  .apply{background:#222; color:#fff; text-decoration:none; border-radius:20px; padding:5px 16px; font-size:13px; font-family:-apple-system,sans-serif;}

  .status{text-align:center; color:#777; font-size:14px; padding:60px 0; font-family:-apple-system,sans-serif; white-space:pre-line;}

  .refresh{position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); right:20px;
    width:52px; height:52px; border-radius:50%; background:#222; color:#fff; border:none;
    box-shadow:0 6px 16px rgba(0,0,0,.2); display:flex; align-items:center; justify-content:center;}
  .refresh.spin svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .runnow{position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); right:82px;
    height:52px; padding:0 18px; border-radius:26px; background:#1F8A4C; color:#fff; border:none;
    box-shadow:0 6px 16px rgba(0,0,0,.2); display:flex; align-items:center; gap:8px;
    font-size:13px; font-weight:700; font-family:-apple-system,sans-serif;}
  .runnow.busy{opacity:.7;}
  .runnow .dot{width:8px; height:8px; border-radius:50%; background:#fff;}
  .runnow.busy .dot{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
</style>
</head>
<body>
<div id="wrap">
  <h2>JobPilot HR</h2>
  <p class="meta-line" id="metaLine">Loading…</p>
  <p style="color:#c9c2b3; font-size:10px; margin:-14px 0 18px; font-family:-apple-system,sans-serif;">build 2026-07-11</p>
  <div id="list"><div class="status">Loading jobs…</div></div>
</div>

<button class="runnow" id="runNowBtn" aria-label="Run search now">
  <span class="dot"></span><span id="runNowLabel">Run now</span>
</button>
<button class="refresh" id="refreshBtn" aria-label="Refresh">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
</button>

<script>
// ---- CONFIG: fill these in ----
const JSONBIN_ID = "6a1c66e821f9ee59d2a1b545";
const JSONBIN_READ_KEY = "$2a$10$mbKaxeveb6/T5OcPA39cn.Ypvm2qp9EvWHcrDMzwDQeufICOmVJl."; // read-only, Bins-scoped
const TRIGGER_URL = "https://script.google.com/macros/s/AKfycbxTlBEtgV8UrMCJvx6uVkKTcJegJ5tqVjnhc3JVHBP5fjyH_G4LkeIq9shiX8qh0rgqzA/exec";   // from Apps Script > Deploy > Web app
const TRIGGER_KEY = "Ban0203#"; // must match TRIGGER_KEY in setupKeys()

async function loadJobs(){
  spin(true);
  document.getElementById("metaLine").textContent = "Loading…";
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest?t=${Date.now()}`, {
      cache: "no-store",
      headers: JSONBIN_READ_KEY.indexOf("PASTE") === -1 ? { "X-Access-Key": JSONBIN_READ_KEY } : {}
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const rec = data.record;
    const jobs = (Array.isArray(rec) ? rec : (rec.jobs || []))
      .sort((a,b) => (b.score||0) - (a.score||0));
    document.getElementById("metaLine").textContent =
      `${jobs.length} matches · updated ${fmtTime(rec.updated)}`;
    render(jobs);
  }catch(e){
    document.getElementById("list").innerHTML =
      `<div class="status">Couldn't load jobs.\nPull down or tap refresh to try again.\n(${escapeHtml(e.message)})</div>`;
    document.getElementById("metaLine").textContent = "Load failed";
  }
  spin(false);
}

function fmtTime(iso){
  if(!iso) return "just now";
  const d = new Date(iso);
  return d.toLocaleString("en-IN", { day:"numeric", month:"short", hour:"numeric", minute:"2-digit", hour12:true });
}

function scoreColor(s){
  if(s >= 85) return "#1F8A4C";
  if(s >= 75) return "#B58900";
  return "#888";
}

function fmtPostDate(dateStr){
  if(!dateStr) return "Date not listed";
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return "Date not listed";
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  const when = d.toLocaleDateString("en-IN", { day:"numeric", month:"short" });
  if(days <= 0) return `Posted today (${when})`;
  if(days === 1) return `Posted yesterday (${when})`;
  return `Posted ${days} days ago (${when})`;
}

function render(jobs){
  const list = document.getElementById("list");
  if(!jobs.length){ list.innerHTML = `<div class="status">No jobs yet.\nRun the script or check back later.</div>`; return; }
  list.innerHTML = jobs.map(j => `
    <div class="card">
      <div class="title">${escapeHtml(j.title||"")}</div>
      <div class="company">${escapeHtml(j.company||"")} &middot; ${escapeHtml(j.location||"")}</div>
      <div class="src">${escapeHtml(j.source||"")}${j.reason ? " &middot; " + escapeHtml(j.reason) : ""}</div>
      <div class="postdate">${escapeHtml(fmtPostDate(j.date))}</div>
      <div class="actions">
        <span class="score" style="background:${scoreColor(j.score||0)}">${j.score ?? "–"}</span>
        ${j.url ? `<a class="apply" href="${escapeHtml(j.url)}" target="_blank" rel="noopener">Apply →</a>` : ""}
      </div>
    </div>
  `).join("");
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function spin(on){ document.getElementById("refreshBtn").classList.toggle("spin", on); }

async function runNow(){
  if(TRIGGER_URL.indexOf("PASTE") !== -1){
    alert("Set up the Web App URL and trigger key first — see setup steps.");
    return;
  }
  const btn = document.getElementById("runNowBtn");
  const label = document.getElementById("runNowLabel");
  btn.classList.add("busy");
  label.textContent = "Searching…";
  try{
    // Apps Script web apps don't send CORS headers for GET, so we fire in
    // no-cors mode. The fetch still waits for the script to finish running
    // (Apps Script holds the connection open until doGet returns) even
    // though we can't read the response body.
    await fetch(`${TRIGGER_URL}?key=${encodeURIComponent(TRIGGER_KEY)}`, { mode: "no-cors" });
  }catch(e){
    // no-cors fetches can still reject on network-level failures
  }
  label.textContent = "Fetching results…";
  await loadJobs();
  btn.classList.remove("busy");
  label.textContent = "Run now";
}

document.getElementById("refreshBtn").addEventListener("click", loadJobs);
document.getElementById("runNowBtn").addEventListener("click", runNow);
loadJobs();
</script>
</body>
</html>
